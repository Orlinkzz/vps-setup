name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # every Monday

permissions:
  contents: read

jobs:
  syntax:
    name: Shell syntax + i18n coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck -x -s bash setup.sh install.sh lib/*.sh lib/i18n/*.sh modules/*/*.sh tests/*.sh
      - name: Check i18n keys
        run: |
          used=$(grep -rhoE '\b t "[a-z0-9_]+\.[a-z0-9_.]+' setup.sh lib modules | sed -E 's/^ t "//' | sort -u)
          missing=0
          for k in $used; do
            grep -qF "MSG[$k]=" lib/i18n/en.sh || { echo "MISSING EN: $k"; missing=1; }
            grep -qF "MSG[$k]=" lib/i18n/id.sh 2>/dev/null || { echo "MISSING ID: $k"; missing=1; }
          done
          exit $missing

  unit:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/unit.sh

  dry-run:
    name: Dry run (all presets × servers)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/dry-run.sh

  templates:
    name: Template validation (nginx)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light openssl
      - run: NO_LIVE=1 bash tests/templates.sh

  docker:
    name: Full integration (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: |
          cat > Dockerfile.test <<'DEOF'
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update -qq && apt-get install -y -qq nginx-light curl python3 sudo openssl ca-certificates
          COPY . /opt/vps-setup
          WORKDIR /opt/vps-setup
          CINT /opt/vps-setup/.github/workflows/ci-runner.sh
          DEOF
          docker build -t vps-test -f Dockerfile.test .
      - name: Run in-container tests
        run: |
          docker run --rm --cap-add=NET_ADMIN vps-test
