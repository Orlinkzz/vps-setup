name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # every Monday

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version | sed -n 2p
      - run: shellcheck -x -s bash setup.sh install.sh lib/*.sh lib/i18n/*.sh modules/*/*.sh templates/cloudflare/*.sh tests/*.sh

  tests:
    name: Unit, feature, dry-run and template tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nginx, Apache and Caddy (without starting them) so every template is validated
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx apache2 openssl curl gnupg debian-keyring debian-archive-keyring apt-transport-https
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq caddy
          sudo rm -f /usr/sbin/policy-rc.d
      - run: bash tests/unit.sh
      - run: bash tests/features.sh
      - run: bash tests/secrets.sh   # passwords never reach the log, the screen or a command line
      - run: bash tests/dry-run.sh   # syntax, i18n key coverage (en + id), every server x site type, uninstall
      - run: bash tests/manage.sh    # list/remove sites, list/drop databases (stubs, no real system changes)
      - run: sudo env NO_LIVE=1 bash tests/templates.sh   # nginx -t, apache2 -t and caddy validate
      - run: sudo bash tests/cloudflare.sh   # real-IP config vs the real nginx config tester

  integration:
    name: Real nginx + apache run (twice) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}        # a throw-away VM, so the destructive test is safe here
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, experimental: false }
          # Ubuntu 22.04 ships nginx 1.18, which exercises the "old nginx" code path.
          - { os: ubuntu-22.04, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - name: Install the web servers without starting them
        # On a runner with systemd the packages start themselves on port 80; the second one then
        # fails to bind, its postinst fails and apt exits non-zero. policy-rc.d (101) forbids that.
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx apache2 curl python3 openssl
          sudo rm -f /usr/sbin/policy-rc.d
      - name: Free port 80 (the test starts the servers itself)
        run: sudo systemctl stop nginx apache2 || true
      - run: sudo env DISPOSABLE=1 bash tests/integration.sh
      - run: sudo bash tests/cloudflare.sh   # nginx and Apache config testers
      - name: Show logs when the run failed
        if: failure()
        run: |
          for f in /tmp/vps-int.out /tmp/vps-int2.out /var/log/vps-setup.log; do
            echo "::group::$f"; sudo tail -n 80 "$f" 2>/dev/null || echo "(missing)"; echo "::endgroup::"
          done

  # The tool claims Ubuntu, Debian and AlmaLinux/Rocky. These jobs run the non-destructive tests
  # inside each distro's own image (setup.sh picks modules/<family> from /etc/os-release).
  # Every supported release blocks the build. debian:13 is not in os_check yet (it is reported as
  # "untested"), so it stays experimental until it is added there.
  distros:
    name: Tests on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04",  experimental: false }
          - { image: "debian:12",     experimental: false }
          - { image: "debian:13",     experimental: true }
          - { image: "almalinux:8",   experimental: false }
          - { image: "almalinux:9",   experimental: false }
          - { image: "rockylinux:8",  experimental: false }
          - { image: "rockylinux:9",  experimental: false }
    steps:
      - name: Install prerequisites
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bash procps iproute2 curl whiptail ca-certificates git sudo nginx openssl python3
          else
            dnf install -y -q --allowerasing procps-ng iproute curl newt ca-certificates git sudo nginx openssl python3 diffutils
          fi
      - uses: actions/checkout@v4
      - run: bash tests/unit.sh
      - run: bash tests/features.sh
      - run: bash tests/secrets.sh   # passwords never reach the log, the screen or a command line
      - run: bash tests/dry-run.sh
      - run: bash tests/manage.sh
      # This distro's own nginx validates the site templates (on RHEL: with vps-setup's fastcgi-php.conf)
      - run: env NO_LIVE=1 bash tests/templates.sh
