# Managed by vps-setup — basic security headers.
# NOTE: nginx only inherits add_header from the parent level when a block defines
# none of its own. If a location adds its own add_header, include this file there too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# HSTS is intentionally NOT enabled by default. Turn it on only when HTTPS works
# for the domain AND all subdomains you use:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
